<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[TESTE] Concierge Harus — tela cheia (não é o entregável, use /demo)</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23162330%22/><path d=%22M8 7h8v3a4 4 0 0 1-4 4 4 4 0 0 1-4-4V7Z%22 stroke=%22%23B89A57%22 stroke-width=%221.4%22 fill=%22none%22/><path d=%22M12 14v4M9 18h6%22 stroke=%22%23B89A57%22 stroke-width=%221.4%22/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/teste_style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<div class="app">

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-wordmark" aria-label="Concierge Harus">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h8v3a4 4 0 0 1-4 4 4 4 0 0 1-4-4V7Z"/><path d="M12 14v4M9 18h6"/></svg>
                Concierge Harus
            </span>
            <button id="btn-fechar-sidebar" class="btn-icon only-mobile" aria-label="Fechar menu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <button id="btn-nova-conversa" class="btn-nova-conversa-sidebar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Nova conversa
        </button>

        <div class="sidebar-search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="input-busca-conversas" type="text" placeholder="Buscar conversas...">
        </div>

        <nav id="lista-conversas" class="sidebar-conversas"></nav>

        <div class="sidebar-footer">
            <span class="sidebar-footer-info">Harus Concierge · v0.1</span>
        </div>
    </aside>

    <div class="main-column">

        <header class="topbar">
            <button id="btn-abrir-sidebar" class="btn-icon only-mobile" aria-label="Abrir menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div class="brand">
                <span class="brand-title" id="titulo-conversa-atual">Como posso ajudar?</span>
            </div>
        </header>

        <main class="chat-wrapper">
            <div id="chat" class="chat">

                <div id="empty-state" class="empty-state">
                    <div class="empty-orbit" aria-hidden="true">
                        <span class="orbit-ring"></span>
                        <span class="orbit-dot"></span>
                        <span class="orbit-core"></span>
                    </div>
                    <h1>Como posso ajudar?</h1>
                    <p>Pergunte sobre qualquer linha ou coleção do portfólio Harus — amenities, personalizados, acessórios e mais.</p>

                    <div class="suggestions">
                        <button class="suggestion-chip" data-q="Quais linhas de amenities vocês têm pra um hotel de praia?">Amenities pra hotel de praia</button>
                        <button class="suggestion-chip" data-q="Qual a diferença entre a Alma Brasil e a House of Brands?">Alma Brasil x House of Brands</button>
                        <button class="suggestion-chip" data-q="Como funciona a personalização de frascos com a marca do meu hotel?">Frascos personalizados</button>
                        <button class="suggestion-chip" data-q="Vocês têm produtos de alimentação pra café da manhã?">Harus Food / café da manhã</button>
                    </div>
                </div>

            </div>
        </main>

        <footer class="composer-area">
            <form id="form-chat" class="composer">
                <textarea
                    id="input-mensagem"
                    class="composer-input"
                    placeholder="Pergunte sobre um produto ou linha Harus..."
                    rows="1"
                    autofocus
                ></textarea>
                <button type="submit" id="btn-enviar" class="btn-enviar" aria-label="Enviar mensagem">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
            </form>
            <div class="disclaimer">O assistente pode cometer erros. Preço, estoque e prazo são sempre sob consulta com o time comercial Harus.</div>
        </footer>

    </div>
</div>

<script src="/static/teste_app.js"></script>

</body>
</html>
